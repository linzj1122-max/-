name = "product-research-api"
main = "src/worker.ts"
compatibility_date = "2024-12-01"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "RESEARCH_KV"
id = "c66eacf2d1314ecbac8ba8624c4d1642"

[triggers]
crons = ["0 0 * * *", "0 12 * * *", "0 10 * * 5"]

[observability]
enabled = true
