<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 选品调研系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    .header { background: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 18px; font-weight: 600; color: #f1f5f9; }
    .header .badge { background: #3b82f6; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    .chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
    .message.user { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
    .message.assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 4px; }
    .message.system { align-self: center; background: #334155; color: #94a3b8; font-size: 12px; padding: 6px 12px; }
    .message.loading { align-self: flex-start; background: #1e293b; border: 1px solid #334155; color: #94a3b8; }
    .input-area { background: #1e293b; padding: 16px 24px; border-top: 1px solid #334155; display: flex; gap: 12px; }
    .input-area input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; color: #e2e8f0; font-size: 14px; outline: none; }
    .input-area input:focus { border-color: #3b82f6; }
    .input-area button { background: #3b82f6; color: white; border: none; border-radius: 8px; padding: 12px 24px; font-size: 14px; cursor: pointer; font-weight: 500; }
    .input-area button:hover { background: #2563eb; }
    .input-area button:disabled { background: #475569; cursor: not-allowed; }
    .quick-actions { display: flex; gap: 8px; padding: 8px 24px; background: #1e293b; flex-wrap: wrap; }
    .quick-actions button { background: #334155; color: #94a3b8; border: 1px solid #475569; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    .quick-actions button:hover { background: #475569; color: #e2e8f0; }
    .config-panel { position: fixed; top: 0; right: -400px; width: 400px; height: 100vh; background: #1e293b; border-left: 1px solid #334155; padding: 24px; transition: right 0.3s; z-index: 100; overflow-y: auto; }
    .config-panel.open { right: 0; }
    .config-panel h2 { font-size: 16px; margin-bottom: 16px; color: #f1f5f9; }
    .config-panel label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; margin-top: 12px; }
    .config-panel input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; color: #e2e8f0; font-size: 13px; outline: none; }
    .config-panel input:focus { border-color: #3b82f6; }
    .config-panel .save-btn { margin-top: 20px; width: 100%; background: #3b82f6; color: white; border: none; border-radius: 6px; padding: 10px; cursor: pointer; font-size: 14px; }
    .settings-btn { background: none; border: 1px solid #475569; color: #94a3b8; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; margin-left: auto; }
    .settings-btn:hover { background: #334155; color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 AI 选品调研系统</h1>
    <span class="badge">Cloudflare Worker</span>
    <button class="settings-btn" onclick="toggleConfig()">⚙️ 配置</button>
  </div>

  <div class="quick-actions">
    <button onclick="sendQuick('帮我调研户外水壶美国站')">🥤 户外水壶调研</button>
    <button onclick="sendQuick('分析蓝牙耳机市场趋势')">🎧 蓝牙耳机趋势</button>
    <button onclick="sendQuick('TikTok热门宠物用品')">🐾 宠物用品热点</button>
    <button onclick="sendQuick('Amazon厨房小家电竞争分析')">🍳 厨房家电竞争</button>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="message system">欢迎使用 AI 选品调研系统，输入关键词开始调研</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="输入选品关键词，如「帮我调研户外水壶美国站」" onkeydown="if(event.key==='Enter')sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>

  <div class="config-panel" id="configPanel">
    <h2>⚙️ API 配置</h2>
    <label>API 基础地址</label>
    <input type="text" id="cfgApiBase" placeholder="https://your-worker.workers.dev">
    <label>Gateway Token</label>
    <input type="password" id="cfgToken" placeholder="your-gateway-token">
    <button class="save-btn" onclick="saveConfig()">保存配置</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    let conversationHistory = [];

    function getConfig() {
      return {
        apiBase: localStorage.getItem('apiBase') || '',
        token: localStorage.getItem('token') || '',
      };
    }

    function saveConfig() {
      localStorage.setItem('apiBase', document.getElementById('cfgApiBase').value);
      localStorage.setItem('token', document.getElementById('cfgToken').value);
      toggleConfig();
      addSystemMessage('配置已保存');
    }

    function toggleConfig() {
      const panel = document.getElementById('configPanel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) {
        const cfg = getConfig();
        document.getElementById('cfgApiBase').value = cfg.apiBase;
        document.getElementById('cfgToken').value = cfg.token;
      }
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    function addSystemMessage(content) {
      addMessage('system', content);
    }

    function addLoadingMessage() {
      const div = document.createElement('div');
      div.className = 'message loading';
      div.id = 'loadingMsg';
      div.textContent = '正在调研中...';
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    function removeLoadingMessage() {
      const el = document.getElementById('loadingMsg');
      if (el) el.remove();
    }

    function sendQuick(text) {
      userInput.value = text;
      sendMessage();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      const cfg = getConfig();
      if (!cfg.apiBase || !cfg.token) {
        addSystemMessage('请先点击右上角 ⚙️ 配置 API 地址和 Token');
        toggleConfig();
        return;
      }

      addMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });
      userInput.value = '';
      sendBtn.disabled = true;

      const loadingEl = addLoadingMessage();

      try {
        const res = await fetch(`${cfg.apiBase}/api/research/full`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${cfg.token}`,
          },
          body: JSON.stringify({ keyword: text }),
        });

        removeLoadingMessage();

        if (!res.ok) {
          const err = await res.json();
          addMessage('assistant', `❌ 错误: ${err.error || res.statusText}`);
          return;
        }

        const data = await res.json();
        const analysis = data.analysis || {};
        const sources = data.data_sources || {};

        let reply = `📊 **${data.keyword} 选品调研报告**\n\n`;
        reply += `━━━ 交叉分析 ━━━\n`;
        reply += `推荐: ${analysis.recommendation || 'N/A'}\n`;
        reply += `置信度: ${analysis.confidence || 'N/A'}\n`;
        reply += `积极信号: ${analysis.positive_signal_count || 0} / 消极信号: ${analysis.negative_signal_count || 0}\n\n`;

        if (analysis.signal_summary) {
          reply += `━━━ 信号详情 ━━━\n`;
          for (const [source, signal] of Object.entries(analysis.signal_summary)) {
            const icon = signal === 'positive' ? '🟢' : signal === 'negative' ? '🔴' : signal === 'neutral' ? '🟡' : '⚪';
            reply += `${icon} ${source}: ${signal}\n`;
          }
          reply += '\n';
        }

        if (analysis.conflicts?.length) {
          reply += `━━━ 冲突信号 ━━━\n`;
          analysis.conflicts.forEach(c => { reply += `⚠️ ${c}\n`; });
          reply += '\n';
        }

        if (analysis.risks?.length) {
          reply += `━━━ 风险提示 ━━━\n`;
          analysis.risks.forEach(r => { reply += `🔴 ${r}\n`; });
          reply += '\n';
        }

        if (analysis.next_steps?.length) {
          reply += `━━━ 下一步 ━━━\n`;
          analysis.next_steps.forEach(s => { reply += `→ ${s}\n`; });
        }

        addMessage('assistant', reply);
        conversationHistory.push({ role: 'assistant', content: reply });
      } catch (err) {
        removeLoadingMessage();
        addMessage('assistant', `❌ 网络错误: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
